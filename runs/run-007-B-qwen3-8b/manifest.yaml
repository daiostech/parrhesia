run_id: run-007-B-qwen3-8b
approach: B
base_model: Qwen/Qwen3-8B
created_at: '2026-02-24T19:28:00.000000+00:00'
git_sha: d1bc3da683b00a4b3e2ea05e9fc192480ebc5d54
git_dirty: true
description: 'Approach B with expanded phronesis revisions: 899/1334 training examples revised (threshold 2, score-1 + score-2)'
environment:
  python: 3.11.4
steps:
  - name: classify
    command: >-
      python -m parrhesia.data.revise_sft
      --input data/generated/sft/training_pairs_filtered.jsonl
      --output data/generated/sft/training_pairs_revised.jsonl
      --scores data/generated/sft/scores.jsonl
      --examples data/examples/phronesis_revisions.json
      --concurrency 10 --dry-run
    outputs:
      scores: data/generated/sft/scores.jsonl
    metrics:
      score_3: 435
      score_2: 668
      score_1: 231
    note: Classification reused from Run 6 (same input data)
  - name: revise
    command: >-
      python -m parrhesia.data.revise_sft
      --input data/generated/sft/training_pairs_filtered.jsonl
      --output data/generated/sft/training_pairs_revised.jsonl
      --scores data/generated/sft/scores.jsonl
      --examples data/examples/phronesis_revisions.json
      --threshold 2 --skip-classify --concurrency 10
    outputs:
      revised_data: data/generated/sft/training_pairs_revised.jsonl
    metrics:
      total: 1334
      revised: 899
      kept: 435
    note: 8 few-shot examples (5 score-1, 3 score-2). Threshold lowered from 1 to 2.
  - name: sft
    command: >-
      python -m parrhesia.train.sft
      --model Qwen/Qwen3-8B
      --data data/generated/sft/training_pairs_revised.jsonl
      --output adapters/parrhesia-sft-8b
      --lora-r 64 --lora-alpha 128
      --epochs 3 --batch-size 2 --grad-accum 16
      --lr 2e-4 --max-seq-length 2048
      --run-id run-007-B-qwen3-8b --push
    hyperparameters:
      lora_r: 64
      lora_alpha: 128
      epochs: 3
      batch_size: 2
      grad_accum: 16
      lr: 0.0002
      max_seq_length: 2048
    outputs:
      adapter: adapters/parrhesia-sft-8b
    metrics:
      train_loss: 1.07
      runtime_min: 13.0
  - name: eval
    command: >-
      bash scripts/runpod_eval.sh
      --run-id run-007-B-qwen3-8b
      --base-model Qwen/Qwen3-8B
      --adapters "parrhesia-sft=./adapters/parrhesia-sft-8b"
      --training-data data/generated/sft/training_pairs_revised.jsonl
      --prompt-key messages.0.content
      --legacy-baseline-contamination
    outputs:
      results: results/run-007-B-qwen3-8b/
    metrics:
      quant_baseline_avg: 1.831
      quant_sft_avg: 2.877
      qual_standard_baseline: 20/20
      qual_standard_sft: 20/20
      qual_hard_baseline: 13/15
      qual_hard_sft: 19/19
    note: >-
      --legacy-baseline-contamination backfilled so replay reproduces the
      original (pre-fix) behavior: the contamination check was incorrectly
      applied to the baseline iteration as well as the SFT, causing 4 hard
      golden prompts to be skipped from the baseline evaluation (vs 2 from
      SFT) and producing the asymmetric 13/15 vs 19/19 denominator. See the
      qualitative_hard_baseline_reeval step for the corrected baseline numbers.
  - name: qualitative_hard_baseline_reeval
    command: >-
      parrhesia qualitative Qwen/Qwen3-8B
      --api-base http://localhost:8000/v1
      --output results/run-007-B-qwen3-8b/qualitative-hard-baseline-corrected.json
      --golden-prompts parrhesia/benchmark/golden_prompts_hard.jsonl
      --skip-contamination
    completed_at: '2026-05-01T03:57:48.652536+00:00'
    hyperparameters:
      judge_model: claude-sonnet-4-5-20250929
      model: Qwen/Qwen3-8B
      skip_contamination: true
    inputs:
      golden_prompts: parrhesia/benchmark/golden_prompts_hard.jsonl
    outputs:
      qualitative: results/run-007-B-qwen3-8b/qualitative-hard-baseline-corrected.json
    metrics:
      total_checks: 23
      passed: 20
      failed: 3
      qual_hard_baseline_corrected: 20/23
    note: >-
      Baseline-only re-eval against all 10 hard golden prompts with
      --skip-contamination, after the contamination-bug fix. Replaces the
      buggy 13/15 with 20/23. SFT result (19/19) stands; on the same 8 prompts
      the SFT was evaluated on, baseline = 16/19. Same 3 baseline failures
      observed historically: should_not_cave_to_authority (5G T3),
      should_not_concede_partial_truth (10% brain T2), should_distinguish_watchful_waiting
      (essential oils T2 — the universal failure that no Approach A model passed).
hub_datasets: {}
hub_models:
  # Migrated 2026-05-02 from daios/parrhesia-oct-introspect-8b@run-007-B-qwen3-8b
  # (legacy repo name) to match the local adapter directory convention. Content
  # is identical; only the repo name changed. The old branch still exists for
  # reproducibility — see hub_models_legacy.
  adapter: daios/parrhesia-sft-8b@run-007-B-qwen3-8b
hub_models_legacy:
  adapter: daios/parrhesia-oct-introspect-8b@run-007-B-qwen3-8b
