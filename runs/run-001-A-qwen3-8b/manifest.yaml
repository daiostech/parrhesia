run_id: run-001-A-qwen3-8b
approach: A
base_model: Qwen/Qwen3-8B
created_at: '2026-02-08T00:00:00+00:00'
git_sha: ''
git_dirty: false
description: >-
  First OCT + Introspection run on Qwen3-8B. 500 DPO pairs, 23 filtered
  introspection entries, light-touch SFT. Retroactively reconstructed from log.md.
environment:
  python: '3.11.4'
  pytorch: 2.6.0+cu124
  unsloth: '2026.1.4'
  peft: 0.18.1
  cuda: '12.4'
  gpu: NVIDIA GeForce RTX 4090
steps:
  - step_name: prompts
    command: >-
      python -m parrhesia.data.generate_oct prompts
      --num-per-category 50
    completed_at: '2026-02-08T00:00:00+00:00'
    hyperparameters:
      num_per_category: 50
      teacher_model: claude-sonnet-4-5-20250929
      temperature: 0.9
      max_tokens: 4096
    inputs:
      taxonomy: parrhesia/taxonomy/taxonomy.json
    outputs:
      prompts: data/generated/oct/prompts.jsonl
    hub_refs: {}
    metrics:
      count: 500
      categories: 10
      min_length_chars: 67
      max_length_chars: 297
      avg_length_chars: 134
    notes: >-
      Sequential API calls (batch API was too slow — 30+ min with 0/500 completing).

  - step_name: chosen
    command: >-
      python -m parrhesia.data.generate_oct chosen
      --no-batch
    completed_at: '2026-02-08T00:00:00+00:00'
    hyperparameters:
      teacher_model: claude-sonnet-4-5-20250929
      temperature: 0.7
      max_tokens: 2048
      system_prompt: parrhesiastes constitution
      batch: false
    inputs:
      prompts: data/generated/oct/prompts.jsonl
      constitution: parrhesia/taxonomy/constitutions/parrhesiastes.md
    outputs:
      chosen: data/generated/oct/chosen.jsonl
    hub_refs: {}
    metrics:
      count: 500
      success_rate: 1.0
      min_length_chars: 68
      max_length_chars: 2173
      avg_length_chars: 1382
    notes: ''

  - step_name: rejected
    command: >-
      python -m parrhesia.data.generate_oct rejected
      --model Qwen/Qwen2.5-7B-Instruct-Turbo
      --api-base https://api.together.xyz/v1
      --api-key $TOGETHER_API_KEY
    completed_at: '2026-02-08T00:00:00+00:00'
    hyperparameters:
      student_model: Qwen/Qwen2.5-7B-Instruct-Turbo
      temperature: 0.7
      max_tokens: 2048
      system_prompt: none
      api_provider: together.ai
    inputs:
      prompts: data/generated/oct/prompts.jsonl
    outputs:
      rejected: data/generated/oct/rejected.jsonl
    hub_refs: {}
    metrics:
      count: 500
      success_rate: 1.0
      min_length_chars: 132
      max_length_chars: 4835
      avg_length_chars: 1812
      cost_usd: 0.10
    notes: >-
      Qwen3-8B was not available on Together.ai serverless. Qwen2.5-7B-Instruct-Turbo
      was used instead. Ollama (local CPU) was tested but impractical (~2 min per
      short response on Apple Silicon).

  - step_name: combine
    command: >-
      python -m parrhesia.data.generate_oct combine
    completed_at: '2026-02-08T00:00:00+00:00'
    hyperparameters: {}
    inputs:
      chosen: data/generated/oct/chosen.jsonl
      rejected: data/generated/oct/rejected.jsonl
    outputs:
      dpo_pairs: data/generated/oct/dpo_pairs.jsonl
    hub_refs: {}
    metrics:
      pairs: 500
      skipped: 0
    notes: ''

  - step_name: dpo_training
    command: >-
      python -m parrhesia.train.dpo
      --model Qwen/Qwen3-8B
      --data data/generated/oct/dpo_pairs.jsonl
      --output adapters/parrhesia-oct-8b
      --lora-r 64
      --lora-alpha 64
      --epochs 2
      --batch-size 2
      --grad-accum 8
      --lr 5e-6
      --beta 0.1
      --max-length 1536
      --max-prompt-length 512
      --max-seq-length 2048
      --seed 42
    completed_at: '2026-02-08T00:00:00+00:00'
    hyperparameters:
      base_model: Qwen/Qwen3-8B
      lora_r: 64
      lora_alpha: 64
      lora_dropout: 0.0
      lora_bias: none
      target_modules: q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj
      gradient_checkpointing: unsloth
      epochs: 2
      batch_size: 2
      gradient_accumulation_steps: 8
      effective_batch_size: 16
      learning_rate: 5.0e-06
      dpo_beta: 0.1
      max_length: 1536
      max_prompt_length: 512
      max_seq_length: 2048
      warmup_ratio: 0.1
      optimizer: adamw_8bit
      precision: bf16
      seed: 42
      save_steps: 100
      quantization: QLoRA 4-bit (bitsandbytes)
    inputs:
      dpo_pairs: data/generated/oct/dpo_pairs.jsonl
    outputs:
      adapter: adapters/parrhesia-oct-8b
    hub_refs: {}
    metrics:
      training_pairs: 500
      checkpoints: checkpoint-64
      adapter_size_mb: 666
    notes: >-
      RunPod RTX 4090, 50GB container disk. Training time ~30-60 min.
      PyTorch upgraded from pod default 2.4.1 to 2.6.0 for unsloth compatibility.

  - step_name: introspection
    command: >-
      bash scripts/runpod_introspection.sh
    completed_at: '2026-02-09T00:00:00+00:00'
    hyperparameters:
      model_served_via: vLLM with LoRA adapter
      vllm_model: Qwen/Qwen3-8B
      vllm_lora_modules: parrhesia=./adapters/parrhesia-oct-8b
      vllm_max_lora_rank: 64
      vllm_max_model_len: 8192
      api_model_name: parrhesia
      self_reflection_temperature: 0.8
      self_reflection_max_tokens: 1024
      self_reflection_prompts: 45
      conversation_temperature: 0.8
      conversation_max_tokens_per_turn: 512
      conversation_seeds: 20
      conversation_turns: 6
      principle_temperature: 0.8
      principle_max_tokens: 1024
      principle_prompts: 37
      judge_model: claude-sonnet-4-5-20250929
      judge_min_score: 6
      judge_max_score: 9
      heuristic_max_length: 4000
    inputs:
      adapter: adapters/parrhesia-oct-8b
    outputs:
      self_reflections: data/generated/introspection/self_reflections.jsonl
      self_conversations: data/generated/introspection/self_conversations.jsonl
      principle_derivations: data/generated/introspection/principle_derivations.jsonl
      filtered: data/generated/introspection/filtered.jsonl
      filter_stats: data/generated/introspection/filter_stats.json
      sft_data: data/generated/introspection/sft_introspection.jsonl
    hub_refs: {}
    metrics:
      total_generated: 102
      heuristic_passed: 74
      heuristic_pass_rate: 0.725
      judge_passed: 23
      overall_pass_rate: 0.225
      score_mean: 4.24
      score_min: 0
      score_max: 8
      self_reflection_pass_rate: 0.089
      self_conversation_pass_rate: 0.0
      principle_derivation_pass_rate: 0.514
      sft_entries: 23
    notes: >-
      Principle derivations had highest quality (51.4% pass rate). Self-reflections
      mostly shallow (8.9%). Self-conversations all failed (0% — agreement loops,
      lack of dialectical tension). 23 SFT examples is thin.

  - step_name: sft_introspection
    command: >-
      python -m parrhesia.train.sft
      --model adapters/parrhesia-oct-8b
      --data data/generated/introspection/sft_introspection.jsonl
      --output adapters/parrhesia-oct-introspect-8b
      --lr 5e-5
      --epochs 2
    completed_at: '2026-02-09T00:00:00+00:00'
    hyperparameters:
      base_adapter: adapters/parrhesia-oct-8b
      learning_rate: 5.0e-05
      epochs: 2
      batch_size: 2
      gradient_accumulation_steps: 4
      max_seq_length: 2048
      optimizer: adamw_8bit
      precision: bf16
      seed: 42
    inputs:
      sft_data: data/generated/introspection/sft_introspection.jsonl
      base_adapter: adapters/parrhesia-oct-8b
    outputs:
      adapter: adapters/parrhesia-oct-introspect-8b
    hub_refs: {}
    metrics:
      training_examples: 23
    notes: >-
      Light-touch SFT on top of DPO adapter. Continues training existing LoRA.
hub_datasets: {}
hub_models: {}
