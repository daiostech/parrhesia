<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- vertical axis -->
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#8a8a94"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b76"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b76"/>
    </marker>
  </defs>

  <line x1="40" y1="470" x2="40" y2="92" stroke="#8a8a94" stroke-width="1.5" marker-end="url(#up)"/>
  <text x="54" y="100" font-size="12" font-weight="600" letter-spacing="0.8" fill="#6b6b76">BEST AND RIGHT</text>

  <!-- the mean -->
  <rect x="300" y="110" width="400" height="128" rx="7" fill="#eaf6ef" stroke="#2f8f63" stroke-width="2"/>
  <text x="320" y="134" font-size="11" font-weight="700" letter-spacing="0.6" fill="#2f8f63">THE MEAN, AN EXTREME OF GOODNESS</text>
  <text x="320" y="162" font-size="19" font-weight="700" fill="#1f6b48">Truth-teller</text>
  <text x="320" y="186" font-size="13" fill="#2c4a3c">pleases for its own sake, guided by "what is noble and</text>
  <text x="320" y="206" font-size="13" fill="#2c4a3c">what is useful" (<tspan font-style="italic">to kalon kai to sumpheron</tspan>, 1126b29)</text>

  <!-- dashed connectors -->
  <line x1="420" y1="240" x2="300" y2="356" stroke="#b0b0b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="580" y1="240" x2="700" y2="356" stroke="#b0b0b8" stroke-width="1.4" stroke-dasharray="5 5"/>

  <!-- opposed-to-both note -->
  <text x="712" y="300" font-size="12" fill="#6b6b76">opposed to both,</text>
  <text x="712" y="318" font-size="12" fill="#6b6b76">as "neither" (Met. X.5)</text>

  <!-- excess -->
  <rect x="40" y="358" width="360" height="130" rx="7" fill="#fdeeed" stroke="#c0564e" stroke-width="1.6"/>
  <text x="58" y="382" font-size="11" font-weight="700" letter-spacing="0.6" fill="#a8453d">EXCESS: PLEASES, UNGOVERNED</text>
  <text x="58" y="408" font-size="15" font-weight="700" fill="#9c342c">Obsequious (<tspan font-style="italic">areskos</tspan>)</text>
  <text x="58" y="427" font-size="12.5" fill="#5c3a37">avoids all pain, even when the noble</text>
  <text x="58" y="444" font-size="12.5" fill="#5c3a37">or the useful calls for it</text>
  <text x="58" y="468" font-size="15" font-weight="700" fill="#9c342c">Flatterer (<tspan font-style="italic">kolax</tspan>)</text>
  <text x="213" y="468" font-size="12.5" fill="#5c3a37">pleases for his own gain</text>

  <!-- deficiency -->
  <rect x="580" y="358" width="340" height="130" rx="7" fill="#fdeeed" stroke="#c0564e" stroke-width="1.6"/>
  <text x="598" y="382" font-size="11" font-weight="700" letter-spacing="0.6" fill="#a8453d">DEFICIENCY: PAINS, UNGOVERNED</text>
  <text x="598" y="408" font-size="15" font-weight="700" fill="#9c342c">Bad-tempered (<tspan font-style="italic">duskolos</tspan>)</text>
  <text x="598" y="432" font-size="12.5" fill="#5c3a37">obstructs everything, thinks</text>
  <text x="598" y="449" font-size="12.5" fill="#5c3a37">nothing of causing pain</text>

  <!-- contraries axis -->
  <line x1="404" y1="423" x2="576" y2="423" stroke="#6b6b76" stroke-width="1.6" marker-start="url(#arrL)" marker-end="url(#arrR)"/>
  <rect x="414" y="398" width="152" height="18" fill="#ffffff"/>
  <text x="490" y="412" font-size="12" font-weight="700" fill="#3d3d45" text-anchor="middle">Contraries, furthest apart</text>
  <rect x="432" y="426" width="116" height="16" fill="#ffffff"/>
  <text x="490" y="438" font-size="11" fill="#6b6b76" text-anchor="middle">NE II.8, 1108b26-35</text>

  <!-- citations -->
  <text x="40" y="518" font-size="10.5" fill="#8a8a94">NE II.6, 1107a6-8 (a mean in essence, an extreme with regard to the best); II.8, 1108b11-35; IV.6, 1126b11-1127a10 (trans. Crisp); Metaphysics X.5, 1056a.</text>
</svg>
