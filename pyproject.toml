[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parrhesia"
version = "0.1.0"
description = "Aristotelian virtue training for truth-telling in AI models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "daios" },
]
keywords = ["ai", "alignment", "sycophancy", "virtue-training", "character-training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.40.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "trl>=0.12.0",
    "torch>=2.1.0",
    "gradio>=5.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "unsloth",
    "bitsandbytes>=0.43.0",
]
eval = [
    "vllm>=0.6.0",
]

[project.scripts]
parrhesia = "parrhesia.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["parrhesia"]
